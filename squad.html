<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Rosa · Fantacalcio26</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <h1>Fantacalcio26</h1>
          <p class="brand-sub">Squadra <strong>visitors</strong></p>
        </div>
      </div>
      <nav class="topnav">
        <a href="index.html" class="nav-link">Giocatori</a>
        <a href="squad.html" class="nav-link active">Rosa</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Pannello crediti -->
    <section class="status-panel">
      <div class="status-credits">
        <span class="status-label">Crediti rimasti</span>
        <span class="status-value" id="credits-remaining">300</span>
        <span class="status-total">/ <span id="credits-total">300</span></span>
      </div>
      <div class="status-squad">
        <span class="status-label">Usati</span>
        <span class="status-value" id="credits-used">0</span>
      </div>
    </section>

    <div class="credits-bar-wrap">
      <div class="credits-bar" id="credits-bar" style="width:0%"></div>
    </div>

    <!-- Elenco rosa -->
    <div id="squad-list" class="players-list"></div>
  </main>

  <!-- Modale note -->
  <div id="note-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="note-title">
      <h2 id="note-title" class="modal-title">Note giocatore</h2>
      <p class="modal-player" id="note-player-name">—</p>
      <label class="field-label" for="note-textarea">Note (es. rigorista 1, infortunato, ecc.)</label>
      <textarea id="note-textarea" class="note-textarea" rows="4" placeholder="Scrivi qui le note…"></textarea>
      <div class="modal-actions">
        <button class="btn" id="note-clear" data-close="1">Svuota</button>
        <button class="btn btn-squad" id="note-save">Salva</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>⚠️ Ruoli presi sempre dalla lista ufficiale (PDF). Mai da altre fonti.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/players.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/squad.js"></script>
</body>
</html>
